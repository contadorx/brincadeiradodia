# Painel de métricas (Umami 3) para rodar no VPS.
# Sobe em 127.0.0.1:3000 (só o próprio servidor enxerga); o Caddy do Postal publica em
# https://metricas.brincadeiradodia.com.br (veja docs/metricas.md).
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_SENHA}@db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET}
      # Necessária para ligar a verificação em duas etapas (2FA) no login do painel.
      TWO_FACTOR_ENCRYPTION_KEY: ${UMAMI_2FA_CHAVE}
      # Não manda dados de uso do próprio Umami para os desenvolvedores dele.
      DISABLE_TELEMETRY: 1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_SENHA}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  umami-db-data:
